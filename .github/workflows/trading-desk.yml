name: Trading Desk

# Offline tests only: Binance Futures rejects GitHub's US runners (HTTP 451), and the desk must never trade from CI.
on:
  push:
    branches: [main]
    paths: ["trading/**", ".github/workflows/trading-desk.yml"]
  pull_request:
    paths: ["trading/**", ".github/workflows/trading-desk.yml"]

jobs:
  test:
    name: unit tests + selftest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: python -W ignore -m unittest discover -s tests -t . -v
      - name: Offline self-test
        run: munder-trader selftest
